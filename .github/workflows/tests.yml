name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes rápidos (regras, rotas e telas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  banco:
    name: Testes do banco (desfeitos no final)
    runs-on: ubuntu-latest
    # Só roda se o segredo SUPABASE_DB_URL estiver cadastrado no GitHub
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db
        if: env.SUPABASE_DB_URL != ''